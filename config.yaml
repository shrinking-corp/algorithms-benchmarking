target_algorithms:
  - name: Kruskal
    type: kruskal
    param_space:
      - name: dependency
        min: 0.1
        max: 10.0
        default: 1.0
      - name: extension
        min: 0.1
        max: 10.0
        default: 3.0
      - name: implementation
        min: 0.1
        max: 10.0
        default: 3.0
      - name: aggregation
        min: 0.1
        max: 10.0
        default: 2.0
      - name: composition
        min: 0.1
        max: 10.0
        default: 2.0
      - name: association
        min: 0.1
        max: 10.0
        default: 1.0

  - name: Genetic
    type: genetic_target
    param_space:
      - name: population_size
        min: 5
        max: 20
        default: 10
        is_integer: true
      - name: generations
        min: 3
        max: 10
        default: 5
        is_integer: true
      - name: mutation_rate
        min: 0.01
        max: 0.5
        default: 0.1
      - name: crossover_rate
        min: 0.1
        max: 1.0
        default: 0.7
      - name: exclusion_threshold
        min: 0.1
        max: 0.9
        default: 0.5
      - name: inclusion_threshold
        min: 0.1
        max: 0.9
        default: 0.6
      - name: fitness__scores__class_class_edges
        min: 0.01
        max: 1.0
        default: 0.6
      - name: fitness__scores__class_attr_edges
        min: 0.01
        max: 1.0
        default: 0.2
      - name: fitness__scores__class_method_edges
        min: 0.01
        max: 1.0
        default: 0.2
      - name: fitness__coefficients__similarity
        min: 0.1
        max: 5.0
        default: 1.0
      - name: fitness__coefficients__edges
        min: 0.1
        max: 5.0
        default: 1.0
      - name: fitness__coefficients__shrink
        min: 0.1
        max: 5.0
        default: 1.0

optimizer:
  type: pso
  pso:
    inertia: 0.729
    cognitive: 1.494
    social: 1.494
