[project]
name = "asws-benchmarking"
version = "0.1.0"
description = "Parameter tuning benchmark for PUML shrinking algorithms via LLM evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "codebleu>=0.6.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "shrinking-algorithms>=0.1.4",
]

[project.scripts]
benchmark = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "data"]

[tool.hatch.metadata]
allow-direct-references = true
